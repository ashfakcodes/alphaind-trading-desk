# fly.toml app configuration file for Bitget SentinelDesk AI Backend
app = "bitget-sentineldesk-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  CORS_ORIGINS = "*"
  BITGET_IS_SIMULATION = "true"
  OPENROUTER_MODEL = "anthropic/claude-3.5-sonnet"
  BITGET_QWEN_MODEL = "qwen3.8-max"
  BITGET_QWEN_BASE_URL = "https://hackathon.bitgetops.com/v1"
  BITGET_QWEN_WIRE_API = "responses"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
