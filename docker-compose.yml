version: '3.8'

services:
  # Python FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphaind-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
      - BITGET_IS_SIMULATION=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - BITGET_QWEN_API_KEY=${BITGET_QWEN_API_KEY:-}
      - BITGET_QWEN_MODEL=${BITGET_QWEN_MODEL:-qwen3.8-max}
      - BITGET_API_KEY=${BITGET_API_KEY:-}
      - BITGET_API_SECRET=${BITGET_API_SECRET:-}
      - BITGET_API_PASSPHRASE=${BITGET_API_PASSPHRASE:-}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Nginx Alpine Static Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphaind-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: alphaind-network
